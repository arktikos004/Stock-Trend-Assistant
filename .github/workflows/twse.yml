# 每日收集證交所開放資料（盤後）到 twse-data 分支（網站 K 線的資料來源）。
#
# 這份資料只提供最新一個交易日、無法指定日期——漏收的日子補不回來，所以：
#   - 一天排三次（收盤後 15:40、17:40、20:40），週六早上再補一次週五；已收過的日子自動略過。
#   - 兩個官方出口都抓：政府資料開放平臺登錄的 CSV 當晚就是當日資料，OpenAPI 隔天清晨才換日；
#     日期不同就各存一份，前一天漏收時還能從 OpenAPI 補回來。
#   - twse-data 分支只用一般 commit 累積，從不 force push。
#   - 只用 Python 標準函式庫（不安裝後端相依），避免別的套件出問題連帶漏收。
# 資料依政府資料開放授權條款釋出，顯名說明見 twse-data 分支的 README.md。
name: twse

on:
  schedule:
    - cron: "40 7 * * 1-5" # 台北 15:40
    - cron: "40 9 * * 1-5" # 台北 17:40
    - cron: "40 12 * * 1-5" # 台北 20:40
    - cron: "0 2 * * 6" # 台北週六 10:00：補抓週五
  workflow_dispatch:

permissions:
  contents: write # 推 twse-data 分支

concurrency:
  group: twse
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 取出 twse-data 分支
        uses: actions/checkout@v4
        with:
          ref: twse-data
          path: _twse

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: 抓取兩個官方出口目前提供的交易日（政府資料開放平臺 CSV、OpenAPI）
        id: fetch
        env:
          PYTHONPATH: backend
          PYTHONIOENCODING: utf-8
        run: python -m stockta.data.twse fetch --out _twse

      - name: 提交新資料（一般 commit）
        run: |
          cd _twse
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            latest=$(find stock_day_all -name '*.json' | sort | tail -n 1 | xargs -r basename -s .json)
            echo "::notice title=證交所資料::沒有新的交易日（已收到 ${latest}）"
            exit 0
          fi
          files=$(git diff --cached --name-only | xargs -n1 basename | sort -u | tr '\n' ' ')
          echo "::notice title=證交所資料::新增 ${files}"
          git commit -qm "twse: ${files}"
          for attempt in 1 2 3; do
            git push -q origin HEAD:twse-data && exit 0
            git pull -q --rebase origin twse-data
          done
          exit 1
